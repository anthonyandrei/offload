name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ubuntu-bash:
    name: Ubuntu Bash contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run workflow contract suite
        run: bash tests/test_workflow_static.sh

      - name: Run execution scope suite
        run: bash tests/test_execution_scope.sh

      - name: Run isolated execution workspace suite
        run: bash tests/test_execution_workspace.sh

      - name: Run research workspace suite
        run: bash tests/test_research_workspace.sh

      - name: Run research acceptance suite
        run: bash tests/test_research_acceptance.sh

      - name: Run failed launch fallback suite
        run: bash tests/test_worker_failure.sh

      - name: Run repository consistency suite
        run: bash tests/test_repository_consistency.sh

      - name: Check retained helper syntax
        run: bash -n scripts/check-execution-scope.sh scripts/execution-workspace.sh scripts/make-research-workspace.sh scripts/cleanup-research-workspace.sh

  macos-bash:
    name: macOS Bash contract suite
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run workflow contract suite
        run: bash tests/test_workflow_static.sh

      - name: Run execution scope suite
        run: bash tests/test_execution_scope.sh

      - name: Run isolated execution workspace suite
        run: bash tests/test_execution_workspace.sh

      - name: Run research workspace suite
        run: bash tests/test_research_workspace.sh

      - name: Run research acceptance suite
        run: bash tests/test_research_acceptance.sh

      - name: Run failed launch fallback suite
        run: bash tests/test_worker_failure.sh

      - name: Run repository consistency suite
        run: bash tests/test_repository_consistency.sh

      - name: Check retained helper syntax
        run: bash -n scripts/check-execution-scope.sh scripts/execution-workspace.sh scripts/make-research-workspace.sh scripts/cleanup-research-workspace.sh

  windows-powershell:
    name: Windows PowerShell contract suite
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run workflow contract suite
        run: pwsh -File tests/test_workflow_static.ps1

      - name: Run execution scope suite
        run: pwsh -File tests/test_execution_scope.ps1

      - name: Run isolated execution workspace suite
        run: pwsh -File tests/test_execution_workspace.ps1

      - name: Run research workspace suite
        run: pwsh -File tests/test_research_workspace.ps1

      - name: Run research acceptance suite
        run: pwsh -File tests/test_research_acceptance.ps1

      - name: Run failed launch fallback suite
        run: pwsh -File tests/test_worker_failure.ps1

      - name: Run repository consistency suite
        run: pwsh -File tests/test_repository_consistency.ps1
